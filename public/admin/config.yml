# Autenticacao via DecapBridge (PKCE): o editor entra com e-mail e senha,
# sem precisar de conta no GitHub. O token de escrita fica guardado no
# DecapBridge, nao neste arquivo.
backend:
  name: git-gateway
  repo: HenryLuka/prototipo-hilariom
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/8545cae2-c757-4a4c-9c84-74018c04983e/pkce
  auth_token_endpoint: /sites/8545cae2-c757-4a4c-9c84-74018c04983e/token
  gateway_url: https://gateway.decapbridge.com

  # Registra no historico quem fez cada alteracao.
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Campos do perfil do editor, vindos do DecapBridge.
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Edicao local (npx decap-server + npm run dev). Ignorado em producao.
local_backend: true

# Configuracoes visuais do painel
logo_url: "/prototipo-hilariom/logo.png"
locale: "pt"

# Endereco do site publicado, usado nos links "ver no site".
# Precisa incluir a subpasta: o site nao responde na raiz do dominio.
site_url: https://henryluka.github.io/prototipo-hilariom

# Onde as imagens enviadas sao gravadas (caminho no repositorio) e como
# sao referenciadas no conteudo (caminho sem a base — src/utils/asset.ts
# acrescenta o prefixo na renderizacao).
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "obras"
    label: "Obras (Portfólio)"
    folder: "src/data/obras"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: '{{title}} - {{local}}'
    fields:
      - {label: "ID (Identificador único na URL)", name: "id", widget: "string", hint: "Exemplo: galpao-logistico-sp. Sem espaços ou acentos."}
      - {label: "Título da Obra", name: "title", widget: "string"}
      - {label: "Segmento", name: "segment", widget: "select", options: ["Industrial", "Comercial", "Logística", "Agronegócio", "Institucionais", "Garagens"]}
      - {label: "Imagem Principal (Hero)", name: "img", widget: "image", hint: "Faça o upload ou cole a URL da imagem destaque da obra"}
      - {label: "Localização", name: "local", widget: "string", hint: "Ex: São Paulo, SP"}
      
      # Métricas (Agrupadas visualmente, mas mantendo a mesma estrutura JSON)
      - {label: "Área Total", name: "area", widget: "string", required: false, hint: "Exemplo: 15.000 m²"}
      - {label: "Volume de Concreto", name: "volume", widget: "string", required: false, hint: "Exemplo: 1.250 m³"}
      - {label: "Prazo de Execução", name: "prazo", widget: "string", required: false, hint: "Exemplo: 45 dias"}
      
      - {label: "Descrição da Obra", name: "desc", widget: "text", hint: "Resumo do case de sucesso"}
      
      - label: "Peças Pré-fabricadas Utilizadas"
        name: "pecas"
        widget: "list"
        required: false
        summary: '{{fields.title}}'
        fields:
          - {label: "ID da peça", name: "id", widget: "string"}
          - {label: "Título da Peça", name: "title", widget: "string"}
          - {label: "Imagem da Peça", name: "img", widget: "image"}
          
      - label: "Galeria de Fotos da Obra"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Adicione fotos extras para o carrossel da obra"
        field: {label: "Foto", name: "photo", widget: "image"}
        
  - name: "clientes"
    label: "Clientes (Quem já construiu com a Hilariom)"
    label_singular: "Cliente"
    folder: "src/data/clientes"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "nome"
    summary: "{{nome}} — {{segmento}}"
    description: "Empresas que já contrataram a Hilariom. Aparecem na página inicial, na seção Quem já construiu com a Hilariom."
    fields:
      - {label: "Nome da empresa", name: "nome", widget: "string"}
      - {label: "Logo", name: "logo", widget: "image", required: false, hint: "De preferência PNG com fundo transparente. Sem logo, o nome aparece escrito no cartão."}
      - {label: "Segmento", name: "segmento", widget: "select", options: ["Industrial", "Logística", "Agronegócio", "Comercial", "Institucionais", "Garagens"]}
      - {label: "Cidade", name: "cidade", widget: "string", required: false, hint: "Ex: Guarulhos, SP"}
      - {label: "Obra realizada", name: "obra", widget: "relation", collection: "obras", value_field: "id", search_fields: ["title"], display_fields: ["title"], required: false, hint: "Opcional. Se escolher uma obra, o cartão do cliente leva à página dela."}
      - {label: "Ordem de exibição", name: "ordem", widget: "number", value_type: "int", default: 10, hint: "Menor número aparece primeiro."}

  - name: "produtos"
    label: "Produtos (Catálogo)"
    folder: "src/data/produtos"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: '{{title}}'
    fields:
      - {label: "ID (slug)", name: "id", widget: "string"}
      - {label: "Título do Produto", name: "title", widget: "string"}
      - {label: "Imagem do Produto", name: "img", widget: "image"}
      - {label: "Descrição Técnica", name: "desc", widget: "text"}

  - name: "parcerias"
    label: "Parcerias (Logos)"
    folder: "src/data/parcerias"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    summary: '{{name}} ({{time}})'
    fields:
      - {label: "Nome da Empresa Parceira", name: "name", widget: "string"}
      - {label: "Tempo de Parceria", name: "time", widget: "string", hint: "Exemplo: 15 anos"}
      - {label: "Logo da Empresa", name: "logo", widget: "image", hint: "Dê preferência para logos com fundo transparente (PNG)"}

  - name: "configuracoes"
    label: "Configurações Globais"
    files:
      - label: "Apresentação Comercial"
        name: "apresentacao"
        file: "src/data/config/apresentacao.json"
        fields:
          - {label: "Arquivo PDF", name: "arquivo", widget: "file", hint: "Faça o upload do arquivo PDF da apresentação"}
          - {label: "Tamanho do Arquivo (Ex: 5.2 MB)", name: "tamanho", widget: "string", required: false}

      - label: "Página inicial — Topo (imagem principal)"
        name: "hero"
        file: "src/data/config/hero.json"
        fields:
          - label: "Imagem de fundo"
            name: "imagem"
            widget: "image"
            hint: "A foto grande do topo do site. Use JPG na horizontal, com cerca de 1920 px de largura e até 500 KB — o painel não reduz o arquivo, e uma foto pesada deixa o site lento para abrir."
          - label: "Descrição da imagem"
            name: "imagem_alt"
            widget: "string"
            hint: "Descreva a foto em poucas palavras. É lida por leitores de tela e pelo Google."
          - label: "Logo"
            name: "logo"
            widget: "image"
            hint: "PNG com fundo transparente e em versão clara, porque fica sobre a foto."
          - label: "Botão — texto"
            name: "botao_texto"
            widget: "string"
            hint: "Ex.: Solicite um"
          - label: "Botão — palavra em destaque"
            name: "botao_destaque"
            widget: "string"
            required: false
            hint: "Aparece em negrito depois do texto. Ex.: ORÇAMENTO"
          - label: "Botão — leva para"
            name: "botao_link"
            widget: "select"
            options:
              - {label: "Contato e orçamento", value: "/contato/"}
              - {label: "Apresentação comercial (PDF)", value: "/apresentacao/"}
              - {label: "Obras", value: "/obras/"}
              - {label: "Produtos", value: "/produtos/"}
              - {label: "Mercados de atuação", value: "/mercados/"}
              - {label: "Quem somos", value: "/sobre/"}

      - label: "Página inicial — Nossa Fábrica"
        name: "fabrica"
        file: "src/data/config/fabrica.json"
        fields:
          - label: "Texto de apresentação"
            name: "descricao"
            widget: "text"
            hint: "Aparece logo abaixo do título Nossa Fábrica."
          - label: "Link do vídeo (YouTube)"
            name: "video"
            widget: "string"
            hint: "Cole o link do YouTube, ex.: https://www.youtube.com/watch?v=XXXXXXXXXXX"
            pattern: ['^(https?://(www\.|m\.)?(youtube\.com|youtu\.be)/.+|[\w-]{11})$', "Use um link do YouTube (youtube.com ou youtu.be)"]
          - label: "Imagem de capa do vídeo"
            name: "capa"
            widget: "image"
            hint: "Aparece antes de apertar o play. O ideal é um quadro do próprio vídeo."
          - label: "Diferenciais da fábrica"
            name: "diferenciais"
            widget: "list"
            summary: "{{fields.titulo}}"
            hint: "Os cartões com ícone abaixo do vídeo. Arraste para reordenar."
            fields:
              - label: "Ícone"
                name: "icone"
                widget: "select"
                default: "estrutura"
                options:
                  - {label: "Controle de qualidade (selo)", value: "qualidade"}
                  - {label: "Usina / produção", value: "usina"}
                  - {label: "Logística / caminhão", value: "logistica"}
                  - {label: "Tecnologia / engrenagem", value: "tecnologia"}
                  - {label: "Prazo / relógio", value: "prazo"}
                  - {label: "Segurança / escudo", value: "seguranca"}
                  - {label: "Sustentabilidade / folha", value: "sustentabilidade"}
                  - {label: "Estrutura / camadas", value: "estrutura"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Texto", name: "texto", widget: "text"}
